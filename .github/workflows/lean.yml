name: Lean check
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean_check
      - name: Print axioms
        working-directory: lean_check
        run: lake env lean Axioms.lean
